<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YNAC — Signing you in</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf7f2;
      color: #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #131312; color: #f1ece2; }
    }
    .card { text-align: center; }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid rgba(128,128,128,0.3);
      border-top-color: #4d7c5f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #a44a4a; max-width: 40ch; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <div id="msg">Signing you in&hellip;</div>
  </div>
  <script>
    (function () {
      // Storage keys are duplicated from js/auth.js on purpose: this page runs
      // standalone, before any module loads. Keep them in sync.
      const TOKEN_KEY = 'ynac.token';
      const STATE_KEY = 'ynac.oauth_state';
      const DEFAULT_TTL_SECONDS = 2 * 60 * 60; // YNAB implicit-grant tokens last 2h.
      const MAX_TTL_SECONDS = 24 * 60 * 60;

      // Everything in the fragment is attacker-supplied until the `state` nonce
      // says otherwise — this origin holds the YNAB token, so nothing from here
      // may ever reach innerHTML.
      const hash = window.location.hash.startsWith('#')
        ? window.location.hash.slice(1)
        : window.location.hash;
      const params = new URLSearchParams(hash);
      const token = params.get('access_token');
      const state = params.get('state');
      const err = params.get('error');
      const errDescription = params.get('error_description');

      // Drop the fragment as soon as it's parsed so the access token stops
      // riding along in the address bar (and in anything the user pastes).
      try {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      } catch (e) {
        /* Non-fatal: the redirect below clears it anyway. */
      }

      const expected = takeStateNonce();

      if (err) {
        showError('Sign-in failed: ' + describe(err, errDescription) + '.');
        return;
      }

      if (!token) {
        showError('No access token returned.');
        return;
      }

      // Single-use nonce check, before the token touches localStorage. A
      // callback link that didn't start from this tab's Sign in button gets
      // nothing stored.
      if (!expected || !state || state !== expected) {
        showError(
          'This sign-in response could not be verified, so it was discarded. ' +
          'Start again from YNAC.'
        );
        return;
      }

      try {
        localStorage.setItem(TOKEN_KEY, JSON.stringify({
          token: token,
          expiresAt: Date.now() + ttlSeconds(params.get('expires_in')) * 1000,
        }));
      } catch (e) {
        showError('Could not save token to localStorage: ' + (e && e.message ? e.message : 'unknown error') + '.');
        return;
      }

      window.location.replace('./');

      // Read and immediately clear the nonce — it authorises exactly one
      // callback, whatever the outcome.
      function takeStateNonce() {
        try {
          const value = sessionStorage.getItem(STATE_KEY);
          sessionStorage.removeItem(STATE_KEY);
          return value;
        } catch (e) {
          return null;
        }
      }

      function ttlSeconds(raw) {
        const n = parseInt(raw || '', 10);
        if (!isFinite(n) || n <= 0) return DEFAULT_TTL_SECONDS;
        return Math.min(n, MAX_TTL_SECONDS);
      }

      // Untrusted strings, kept short so a padded fragment can't push the
      // "Try again" link off the page.
      function describe(code, description) {
        const parts = [code, description].filter(Boolean).join(' — ');
        return parts.length > 200 ? parts.slice(0, 200) + '…' : parts;
      }

      // Rebuilt as nodes: the message is textContent, the link is a real
      // element. The old innerHTML version turned any crafted callback URL into
      // script execution on the origin that stores the token.
      function showError(text) {
        const spinner = document.querySelector('.spinner');
        if (spinner) spinner.remove();

        const box = document.createElement('div');
        box.className = 'error';
        box.appendChild(document.createTextNode(text + ' '));
        const link = document.createElement('a');
        link.href = './';
        link.textContent = 'Try again';
        box.appendChild(link);
        box.appendChild(document.createTextNode('.'));

        const msg = document.getElementById('msg');
        msg.textContent = '';
        msg.appendChild(box);
      }
    })();
  </script>
</body>
</html>
